<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iannarone Architettura ed Ingegneria — Arch. Angelo Iannarone, Ariano Irpino</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       VARIABILI E RESET
       ========================================= */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f6f4;
      --bg-dark: #141619;
      --bg-dark-card: #1e2126;
      --text-main: #1a1c20;
      --text-muted: #5a606a;
      --text-light: #f3f4f6;
      --accent: #b87a3d; /* Tono bronzo / terracotta architettonico */
      --accent-hover: #9c632b;
      --border-light: #e2e4e8;
      --border-dark: #2e323a;
      --radius: 8px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-primary);
      line-height: 1.65;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.25;
      color: var(--text-main);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* =========================================
       HEADER & NAVIGAZIONE
       ========================================= */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-light);
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 76px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      display: flex;
      flex-direction: column;
    }

    .brand span {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
      align-items: center;
    }

    nav a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      position: relative;
    }

    nav a:hover {
      color: var(--accent);
    }

    .nav-cta {
      background: var(--bg-dark);
      color: #fff !important;
      padding: 10px 18px;
      border-radius: var(--radius);
    }

    .nav-cta:hover {
      background: var(--accent);
    }

    /* =========================================
       HERO SECTION
       ========================================= */
    .hero {
      padding: 64px 0 80px;
      background: linear-gradient(to bottom, var(--bg-secondary) 0%, var(--bg-primary) 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }

    .geo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 16px;
      background: rgba(184, 122, 61, 0.1);
      padding: 6px 12px;
      border-radius: 4px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4vw, 3.3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero p.lead {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 580px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 26px;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--bg-dark);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      background: #fff;
    }

    .btn-outline:hover {
      border-color: var(--bg-dark);
    }

    .hero-image-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .hero-image-card img {
      width: 100%;
      height: 500px;
      object-fit: cover;
    }

    /* Info Strip sotto Hero */
    .studio-highlights {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 28px;
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      margin-top: 40px;
    }

    .highlight-item small {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .highlight-item strong {
      font-size: 0.98rem;
      color: var(--text-main);
    }

    /* =========================================
       MARQUEE / TICKER COMPETENZE
       ========================================= */
    .ticker {
      background: var(--bg-dark);
      color: #fff;
      padding: 16px 0;
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid var(--border-dark);
      border-bottom: 1px solid var(--border-dark);
    }

    .ticker-content {
      display: inline-block;
      animation: marquee 32s linear infinite;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .ticker-content span {
      margin: 0 24px;
      color: #d1d5db;
    }

    .ticker-content span::after {
      content: "•";
      margin-left: 24px;
      color: var(--accent);
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    /* =========================================
       SEZIONI GENERALI
       ========================================= */
    section {
      padding: 96px 0;
    }

    .section-alt {
      background-color: var(--bg-secondary);
    }

    .section-header {
      max-width: 720px;
      margin-bottom: 56px;
    }

    .section-num {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .section-header h2 {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      margin-bottom: 14px;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* =========================================
       01. LO STUDIO
       ========================================= */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center;
    }

    .about-img {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .about-img img {
      width: 100%;
      height: 440px;
      object-fit: cover;
    }

    .about-text p {
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* =========================================
       02. LE COMPETENZE
       ========================================= */
    .skills-layout {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 48px;
      align-items: start;
    }

    .skills-visual {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }

    .skills-visual img {
      width: 100%;
      height: 520px;
      object-fit: cover;
    }

    .skills-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px;
      background: linear-gradient(to top, rgba(20, 22, 25, 0.92), transparent);
      color: #fff;
    }

    .skills-overlay span {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 600;
    }

    .skills-overlay p {
      font-size: 1.35rem;
      font-weight: 600;
      margin-top: 4px;
    }

    .skills-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .skill-card {
      background: #fff;
      padding: 28px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .skill-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .skill-code {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(184, 122, 61, 0.12);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    .skill-card h4 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .skill-card p {
      font-size: 0.93rem;
      color: var(--text-muted);
    }
